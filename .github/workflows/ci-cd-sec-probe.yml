name: ci-cd-sec-probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe-hosted-control:
    runs-on: ubuntu-latest
    steps:
      - name: control - provenance and token observation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "PROBE_CONTROL: event=${{ github.event_name }} actor=${{ github.actor }} association=${{ github.event.pull_request.author_association }}"
          curl -s -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/${{ github.repository }} | grep -o '"permissions":{[^}]*}' || echo "PROBE_CONTROL: permissions field absent (fork token is read-only)"

  probe-selfhosted:
    runs-on: [self-hosted]
    steps:
      - name: benign runner identification (log output only)
        run: echo "PROBE_SH runner=${{ runner.name }} os=${{ runner.os }} arch=${{ runner.arch }} repo=${{ github.repository }} actor=${{ github.actor }}"
