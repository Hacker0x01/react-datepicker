name: "Deploy docs site"

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Corepack enable
        run: corepack enable

      - name: Yarn setup
        run: corepack prepare --activate

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: yarn install

      - name: Install docs dependencies
        run: yarn --cwd docs-site install

      - name: Build datepicker
        run: yarn build

      - name: Build docs
        run: yarn --cwd docs-site build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: docs-site/dist # The folder the action should deploy.
